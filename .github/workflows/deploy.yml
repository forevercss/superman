name: Deploy Hexo

on:
  push:
    branches: [ "main" ]  # 监听 main 分支的推送

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # 关键！递归拉取子模块
          fetch-depth: 0         # 获取完整历史（某些主题需要）

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          npm install -g hexo-cli
          npm install

      - name: Build Site
        run: |
          hexo clean
          hexo generate

      - uses: peaceiris/actions-main@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: main
